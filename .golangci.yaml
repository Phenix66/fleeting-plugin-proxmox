version: "2"
run:
  timeout: 5m
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gomodguard
    - gomodguard_v2
    - musttag
    - testpackage
    - wsl # deprecated
  settings:
    cyclop:
      max-complexity: 15
    lll:
      line-length: 200
      tab-width: 2
    tagliatelle:
      case:
        rules:
          json: snake
    varnamelen:
      ignore-names:
        - vm
        - wg
        - ig
    wsl_v5:
      disable:
        - range
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
